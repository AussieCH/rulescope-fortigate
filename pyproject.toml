[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rulescope"
version = "0.4.0"
description = "FortiGate rule base audit, remediation and change tracking (read-only, on-prem, zero dependencies)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Pavel Simanovski" }]
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
rulescope = "rulescope.cli:main"

[tool.setuptools]
packages = ["rulescope"]
