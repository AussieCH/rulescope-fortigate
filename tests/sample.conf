#config-version=FGT60F-7.4.3-FW-build2573-240201:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890
#buildno=2573
#global_vdom=1
config system global
    set alias "FortiGate-60F"
    set hostname "FGT-LAB"
    set strong-crypto disable
    set timezone "Asia/Jerusalem"
    set admin-https-ssl-versions tlsv1-1 tlsv1-2 tlsv1-3
    set gui-display-hostname enable
end
config system ntp
    set ntpsync disable
end
config system snmp sysinfo
    set status enable
end
config system snmp community
    edit 1
        set name "lab-community-string"
    next
end
config system snmp user
    edit "nms"
        set security-level auth-no-priv
        set auth-proto sha
        set auth-pwd ENC SH2snmpsnmpsnmpsnmpsnmp
    next
end
config system accprofile
    edit "audit-ro"
        set sysgrp read
        set fwgrp read
        set loggrp read
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh
        set type physical
        set role wan
    next
    edit "wan2"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh http telnet snmp
        set type hard-switch
        set role lan
    next
    edit "dmz"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role dmz
    next
    edit "branch-vpn"
        set vdom "root"
        set type tunnel
        set interface "wan1"
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    next
    edit "pavel"
        set trusthost1 192.168.1.0 255.255.255.0
        set two-factor fortitoken
        set fortitoken "FTKMOB0000000000"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
    next
end
config system api-user
    edit "audit"
        set api-key ENC SH2zzzzzzzzzzzzzzzzzzzzzzzzzzzz
        set accprofile "audit-ro"
        set vdom "root"
        config trusthost
            edit 1
                set ipv4-trusthost 192.168.1.50 255.255.255.255
            next
        end
    next
    edit "old-integration"
        set api-key ENC SH2wwwwwwwwwwwwwwwwwwwwwwwwwwwwww
        set accprofile "super_admin"
        set vdom "root"
    next
end
config system replacemsg mail "email-block"
    set buffer "<HTML><BODY>
This email was blocked.
It contained \"dangerous\" content.
</BODY></HTML>"
end
config vpn certificate local
    edit "lab-cert"
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIFHDBOBgkqhkiG9w0BBQ0wQTApBgkqhkiG9w0BBQwwHAQI
-----END ENCRYPTED PRIVATE KEY-----"
    next
end
config system zone
    edit "LAN_ZONE"
        set interface "internal"
        set intrazone allow
    next
end
config user ldap
    edit "DC01"
        set server "10.0.0.10"
        set cnid "sAMAccountName"
        set dn "dc=lab,dc=local"
        set type regular
        set username "svc-ldap"
        set password ENC SH2ldapldapldapldapldap
    next
end
config ips sensor
    edit "default"
        set comment "Prevent critical attacks."
        config entries
            edit 1
                set severity medium high critical
            next
        end
    next
end
config dnsfilter profile
    edit "default"
        set block-botnet enable
    next
end
config vpn ssl web portal
    edit "full-access"
        set tunnel-mode enable
        set web-mode enable
    next
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan1"
        next
        edit 2
            set interface "wan2"
        next
    end
end
config firewall address
    edit "none"
        set subnet 0.0.0.0 255.255.255.255
    next
    edit "all"
    next
    edit "login.microsoft.com"
        set type fqdn
        set fqdn "login.microsoft.com"
    next
    edit "LAN_NET"
        set subnet 192.168.1.0 255.255.255.0
    next
    edit "LAN_HALF_A"
        set subnet 192.168.1.0 255.255.255.128
    next
    edit "LAN_HALF_B"
        set type iprange
        set start-ip 192.168.1.128
        set end-ip 192.168.1.255
    next
    edit "Bad_Host"
        set subnet 203.0.113.66 255.255.255.255
    next
    edit "Web_Server"
        set subnet 10.10.10.20 255.255.255.255
    next
    edit "File_Server"
        set subnet 192.168.1.10 255.255.255.255
    next
    edit "DB_Server"
        set subnet 192.168.1.11 255.255.255.255
    next
    edit "Old_Printer"
        set comment "decommissioned 2023"
        set subnet 192.168.1.250 255.255.255.255
    next
    edit "Update_Site"
        set type fqdn
        set fqdn "updates.example.com"
    next
    edit "Israel"
        set type geography
        set country "IL"
    next
end
config firewall addrgrp
    edit "LAN_HALVES"
        set member "LAN_HALF_A" "LAN_HALF_B"
    next
    edit "Unused_Group"
        set member "Old_Printer"
    next
end
config firewall service custom
    edit "ALL"
        set category "General"
        set protocol IP
    next
    edit "HTTP"
        set category "Web Access"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set category "Web Access"
        set tcp-portrange 443
    next
    edit "SMB"
        set tcp-portrange 445
    next
    edit "MYSQL"
        set tcp-portrange 3306
    next
    edit "PING"
        set protocol ICMP
        set icmptype 8
        unset icmpcode
    next
    edit "ALL_ICMP"
        set protocol ICMP
        unset icmptype
    next
    edit "TCP_8443"
        set tcp-portrange 8443
    next
    edit "WEB_RANGE"
        set tcp-portrange 1-1024
    next
    edit "RDP"
        set tcp-portrange 3389
    next
end
config firewall service group
    edit "WEB_PORTS"
        set member "HTTP" "HTTPS"
    next
end
config firewall vip
    edit "VIP_WEB"
        set extip 198.51.100.10
        set mappedip "10.10.10.20"
        set extintf "wan1"
    next
    edit "VIP_RDP"
        set extip 198.51.100.11
        set mappedip "192.168.1.10"
        set extintf "wan1"
        set portforward enable
        set extport 33890
        set mappedport 3389
    next
    edit "VIP_ALL"
        set extip 198.51.100.20
        set mappedip "10.10.10.30"
        set extintf "wan1"
    next
end
config firewall schedule onetime
    edit "promo-2024"
        set start "00:00 2024/01/01"
        set end "00:00 2024/12/31"
    next
end
config vpn ssl settings
    set servercert "Fortinet_Factory"
    set port 10443
    set source-interface "wan1"
    set source-address "all"
    set ssl-min-proto-ver tls1-1
end
config vpn ipsec phase1-interface
    edit "branch-vpn"
        set interface "wan1"
        set mode aggressive
        set peertype any
        set net-device disable
        set proposal 3des-md5 aes128-sha1
        set dhgrp 2
        set remote-gw 203.0.113.10
        set psksecret ENC c2VjcmV0cHNr
    next
end
config vpn ipsec phase2-interface
    edit "branch-p2"
        set phase1name "branch-vpn"
        set proposal aes128-sha1
        set pfs disable
    next
end
config firewall local-in-policy
    edit 1
        set intf "wan2"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set schedule "always"
    next
end
config router static
    edit 1
        set sdwan-zone "virtual-wan-link"
    next
end
